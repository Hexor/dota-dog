<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratz 比赛数据</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96%;
            --accent-foreground: 222.2 84% 4.9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 600;
            line-height: 2.25rem;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        /* Card */
        .card {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid hsl(var(--border));
        }

        .card-content {
            padding: 1.5rem;
        }

        /* Input */
        .input {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            padding: 0 0.75rem;
            font-size: 0.875rem;
            transition: border-color 0.2s ease;
        }

        .input:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: hsl(var(--ring));
        }

        .input::placeholder {
            color: hsl(var(--muted-foreground));
        }

        /* Label */
        .label {
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1;
            color: hsl(var(--foreground));
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: calc(var(--radius) - 2px);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
            height: 2.5rem;
            padding: 0 1rem;
        }

        .btn-primary {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }

        .btn-primary:hover {
            background-color: hsl(var(--primary) / 0.9);
        }

        .btn-destructive {
            background-color: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
        }

        .btn-destructive:hover {
            background-color: hsl(var(--destructive) / 0.9);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: hsl(var(--muted));
            border-radius: calc(var(--radius) - 2px);
            padding: 0.25rem;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            border-radius: calc(var(--radius) - 4px);
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            color: hsl(var(--muted-foreground));
        }

        .tab:hover {
            background-color: hsl(var(--accent));
            color: hsl(var(--accent-foreground));
        }

        .tab.active {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        /* Table */
        .table {
            width: 100%;
            border-collapse: collapse;
            background-color: hsl(var(--card));
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid hsl(var(--border));
        }

        .table-header {
            background-color: hsl(var(--muted));
            padding: 0.75rem 1rem;
            border-bottom: 1px solid hsl(var(--border));
            font-weight: 600;
            color: hsl(var(--foreground));
            font-size: 0.875rem;
        }

        .table-row {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid hsl(var(--border));
            transition: background-color 0.2s ease;
        }

        .table-row:hover {
            background-color: hsl(var(--muted));
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-cell {
            flex: 1;
            padding: 0 0.5rem;
            font-size: 0.875rem;
        }

        .table-cell:first-child {
            padding-left: 0;
        }

        .table-cell:last-child {
            padding-right: 0;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: calc(var(--radius) - 4px);
            padding: 0.125rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1;
        }

        .badge-success {
            background-color: hsl(142 76% 36%);
            color: hsl(355 7% 97%);
        }

        .badge-destructive {
            background-color: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
        }

        /* Alert */
        .alert {
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .alert-destructive {
            background-color: hsl(var(--destructive) / 0.1);
            border-color: hsl(var(--destructive));
            color: hsl(var(--destructive));
        }

        /* Separator */
        .separator {
            height: 1px;
            background-color: hsl(var(--border));
            margin: 1rem 0;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        /* No data */
        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
            background-color: hsl(var(--muted));
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
        }

        .no-data h3 {
            color: hsl(var(--foreground));
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .stat-item {
            background-color: hsl(var(--card));
            padding: 0.75rem;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid hsl(var(--border));
            text-align: center;
        }

        .stat-number {
            font-size: 1.25rem;
            font-weight: 600;
            color: hsl(var(--primary));
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: hsl(var(--muted-foreground));
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Section headers */
        .section-header {
            color: hsl(var(--foreground));
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .section-subheader {
            color: hsl(142 76% 36%);
            font-size: 0.875rem;
            font-weight: 600;
            margin: 1rem 0 0.5rem 0;
        }

        .section-subheader.destructive {
            color: hsl(var(--destructive));
        }

        /* Info box */
        .info-box {
            margin: 1rem 0;
            padding: 0.75rem;
            background-color: hsl(221 83% 53% / 0.1);
            border-radius: calc(var(--radius) - 2px);
            border-left: 3px solid hsl(221 83% 53%);
        }

        .info-box h4 {
            color: hsl(221 83% 53%);
            margin: 0 0 0.375rem 0;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .info-box p {
            margin: 0.125rem 0;
            color: hsl(var(--foreground));
            font-size: 0.875rem;
        }

        /* Debug section */
        .debug-section {
            margin: 1rem 0;
            padding: 0.75rem;
            background-color: hsl(var(--muted));
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid hsl(var(--border));
        }

        .debug-section summary {
            cursor: pointer;
            font-weight: 600;
            color: hsl(var(--foreground));
            font-size: 0.875rem;
        }

        .debug-section div {
            margin-top: 0.5rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            line-height: 1.4;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }

        /* Additional components */
        .search-section {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        .function-page {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            margin-top: 1rem;
            display: none;
        }

        .function-page.active {
            display: block;
        }

        .match-result {
            display: inline-flex;
            align-items: center;
            border-radius: calc(var(--radius) - 4px);
            padding: 0.125rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1;
        }
    </style>

<body>
    <div class="container">
        <div class="header">
            <h1>Stratz 比赛数据</h1>
            <p>查看Dota2玩家的最近30天比赛记录</p>
        </div>

        <!-- 功能切换按钮 -->
        <div class="tabs">
            <button class="tab active" onclick="switchFunction(&#39;matches&#39;)">比赛记录</button>
            <button class="tab" onclick="switchFunction(&#39;enemy-heroes&#39;)">敌方英雄统计</button>
            <button class="tab" onclick="switchFunction(&#39;ally-heroes&#39;)">友方英雄统计</button>
            <button class="tab" onclick="switchFunction(&#39;my-heroes&#39;)">我的英雄统计</button>
            <button class="tab" onclick="switchFunction(&#39;pick-suggestion&#39;)">选人建议</button>
        </div>

        <div class="search-section">
            <div class="input-group">
                <div class="input-field">
                    <label for="playerId" class="label">Player ID</label>
                    <input type="text" id="playerId" class="input" placeholder="请输入 Dota 数字 ID (例如: 123456789)">
                </div>
            </div>
            <button class="btn btn-primary" onclick="fetchMatches()">查询比赛数据</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>正在获取数据...</p>
        </div>

        <div id="error" class="alert alert-destructive" style="display: block;">获取数据失败: HTTP错误: 403 - {
  "message":"A bearer token is required for a request. View more at https://stratz.com/api"
}</div>

        <!-- 比赛记录页面 -->
        <div id="matches-page" class="function-page active">
            <div id="statsContainer" style="display: none;"></div>
            <div style="text-align: center; margin-bottom: 20px; color: hsl(var(--muted-foreground)); font-style: italic; font-size: 0.875rem;">
                点击任意比赛行可在新窗口查看详细比赛信息
            </div>
            <div id="matchesContainer"></div>
        </div>

        <!-- 敌方英雄统计页面 -->
        <div id="enemy-heroes-page" class="function-page">
            <div id="enemyHeroesContainer"></div>
        </div>

        <!-- 友方英雄统计页面 -->
        <div id="ally-heroes-page" class="function-page">
            <div id="allyHeroesContainer"></div>
        </div>

        <!-- 我的英雄统计页面 -->
        <div id="my-heroes-page" class="function-page">
            <div id="myHeroesContainer"></div>
        </div>

        <!-- 选人建议页面 -->
        <div id="pick-suggestion-page" class="function-page">
            <div id="pickSuggestionContainer"></div>
        </div>
    </div>

    <script>
    // 不再需要 API_TOKEN，token 已移到 Cloudflare 环境变量 + /api/stratz 代理

    // GraphQL查询，获取比赛数据
    const TURBO_MATCHES_QUERY = `
        query GetPlayerMatches($steamAccountId: Long!) {
            player(steamAccountId: $steamAccountId) {
                steamAccountId
                steamAccount {
                    name
                    profileUri
                }
                matches(request: {
                    take: 100
                }) {
                    id
                    didRadiantWin
                    durationSeconds
                    startDateTime
                    gameMode
                    players {
                        steamAccountId
                        isRadiant
                        heroId
                        kills
                        deaths
                        assists
                        networth
                        numLastHits
                        level
                        item0Id
                        item1Id
                        item2Id
                        item3Id
                        item4Id
                        item5Id
                    }
                }
            }
        }
    `;

    // 英雄ID到中文名称的映射
    const heroNames = {
        1: "敌法师", 2: "斧王", 3: "祸乱之源", 4: "嗜血狂魔", 5: "水晶室女",
        6: "卓尔游侠", 7: "撼地者", 8: "主宰", 9: "米拉娜", 10: "变体精灵",
        11: "影魔", 12: "幻影长矛手", 13: "帕克", 14: "帕吉", 15: "雷泽",
        16: "沙王", 17: "风暴之灵", 18: "斯温", 19: "小小", 20: "复仇之魂",
        21: "风行者", 22: "宙斯", 23: "昆卡", 25: "莉娜", 26: "莱恩",
        27: "暗影萨满", 28: "斯拉达", 29: "潮汐猎人", 30: "巫医", 31: "巫妖",
        32: "力丸", 33: "谜团", 34: "修补匠", 35: "狙击手", 36: "瘟疫法师",
        37: "术士", 38: "兽王", 39: "痛苦女王", 40: "剧毒术士", 41: "虚空假面",
        42: "冥魂大帝", 43: "死亡先知", 44: "幻影刺客", 45: "帕格纳", 46: "圣堂刺客",
        47: "冥界亚龙", 48: "露娜", 49: "龙骑士", 50: "戴泽", 51: "发条技师",
        52: "拉席克", 53: "先知", 54: "噬魂鬼", 55: "黑暗贤者", 56: "克林克兹",
        57: "全能骑士", 58: "魅惑魔女", 59: "哈斯卡", 60: "暗夜魔王", 61: "育母蜘蛛",
        62: "赏金猎人", 63: "编织者", 64: "杰奇洛", 65: "蝙蝠骑士", 66: "陈",
        67: "幽鬼", 68: "远古冰魄", 69: "末日使者", 70: "熊战士", 71: "裂魂人",
        72: "矮人直升机", 73: "炼金术士", 74: "祈求者", 75: "沉默术士", 76: "殁境神蚀者",
        77: "狼人", 78: "酒仙", 79: "暗影恶魔", 80: "德鲁伊", 81: "混沌骑士",
        82: "米波", 83: "树精卫士", 84: "食人魔魔法师", 85: "不朽尸王", 86: "拉比克",
        87: "干扰者", 88: "司夜刺客", 89: "娜迦海妖", 90: "光之守卫", 91: "艾欧",
        92: "维萨吉", 93: "斯拉克", 94: "美杜莎", 95: "巨魔战将", 96: "半人马战行者",
        97: "马格纳斯", 98: "伐木机", 99: "钢背兽", 100: "巨牙海民", 101: "天怒法师",
        102: "亚巴顿", 103: "上古巨神", 104: "军团指挥官", 105: "工程师", 106: "灰烬之灵",
        107: "大地之灵", 108: "孽主", 109: "恐怖利刃", 110: "凤凰", 111: "神谕者",
        112: "寒冬飞龙", 113: "天穹守望者", 114: "齐天大圣", 119: "邪影芳灵", 120: "石鳞剑士",
        121: "天涯墨客", 123: "森海飞霞", 126: "虚无之灵", 128: "电炎绝手", 129: "玛尔斯",
        131: "马戏团长", 135: "破晓晨光", 136: "玛西", 137: "兽", 138: "琼英碧灵",
        145: "凯"
    };

    function getHeroName(heroId) {
        return heroNames[heroId] || `英雄 ${heroId}`;
    }

    function formatDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    function formatDateTime(timestamp) {
        const date = new Date(timestamp * 1000);
        return date.toLocaleString('zh-CN');
    }

    // 将Steam ID转换为账户ID
    function steamIdToAccountId(steamId) {
        if (!steamId) return null;
        const steamId64 = BigInt(steamId);
        const accountId = steamId64 - BigInt('76561197960265728');
        return accountId.toString();
    }

    async function fetchMatches() {
        const playerIdInput = document.getElementById('playerId').value.trim();

        let accountId = null;

        if (playerIdInput) {
            accountId = playerIdInput;
            localStorage.setItem('savedPlayerId', playerIdInput);
        } else {
            showError('请输入Player ID');
            return;
        }

        const daysBack = 30;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const matchesContainer = document.getElementById('matchesContainer');
        const statsContainer = document.getElementById('statsContainer');
        const searchBtn = document.querySelector('.btn-primary');

        loadingEl.style.display = 'block';
        errorEl.style.display = 'none';
        matchesContainer.innerHTML = '';
        statsContainer.style.display = 'none';
        searchBtn.disabled = true;

        try {
            console.log('发送请求，Account ID:', accountId, '天数:', daysBack);

            // 改为调用自己的 Pages Function 代理，不再直接带 token 请求 stratz
            const response = await fetch('/api/stratz', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    query: TURBO_MATCHES_QUERY,
                    variables: {
                        steamAccountId: parseInt(accountId)
                    }
                })
            });

            console.log('响应状态:', response.status);

            if (!response.ok) {
                const errorText = await response.text();
                console.error('HTTP错误响应:', errorText);
                throw new Error(`HTTP错误: ${response.status} - ${errorText}`);
            }

            const data = await response.json();
            console.log('API响应数据:', data);

            if (data.errors) {
                console.error('GraphQL错误:', data.errors);
                throw new Error(`GraphQL错误: ${data.errors[0].message}`);
            }

            const player = data.data?.player;
            if (!player) {
                throw new Error('找不到该玩家，请检查ID是否正确');
            }

            const allMatches = player.matches;
            console.log('获取到的总比赛数量:', allMatches ? allMatches.length : 0);

            if (!allMatches || allMatches.length === 0) {
                showNoData();
                return;
            }

            const cutoffTime = Math.floor(Date.now() / 1000) - (daysBack * 24 * 60 * 60);
            const filteredMatches = allMatches.filter(match => match.startDateTime >= cutoffTime);

            console.log('过滤后的比赛数量:', filteredMatches.length);

            if (filteredMatches.length === 0) {
                showNoData();
                return;
            }

            displayMatches(filteredMatches, accountId);
            displayStats(filteredMatches, accountId, player);

            window.currentMatches = filteredMatches;
            window.currentAccountId = accountId;
            window.currentPlayer = player;

        } catch (error) {
            console.error('获取数据时出错:', error);
            showError(`获取数据失败: ${error.message}`);
        } finally {
            loadingEl.style.display = 'none';
            searchBtn.disabled = false;
        }
    }

    function showError(message) {
        const errorEl = document.getElementById('error');
        errorEl.innerHTML = message;
        errorEl.style.display = 'block';
    }

    function showNoData() {
        const daysBack = 30;
        const matchesContainer = document.getElementById('matchesContainer');
        matchesContainer.innerHTML = `
            <div class="no-data">
                <h3>没有找到数据</h3>
                <p>最近${daysBack}天没有找到比赛记录，或者ID输入不正确</p>
            </div>
        `;
    }

    function displayStats(matches, accountId, player) {
        const playerAccountId = parseInt(accountId);
        const daysBack = 30;

        let wins = 0;
        let totalKills = 0;
        let totalDeaths = 0;
        let totalAssists = 0;
        let totalDuration = 0;

        matches.forEach(match => {
            const playerData = match.players.find(p => p.steamAccountId === playerAccountId);
            if (playerData) {
                const playerWon = (playerData.isRadiant && match.didRadiantWin) ||
                                (!playerData.isRadiant && !match.didRadiantWin);
                if (playerWon) wins++;

                totalKills += playerData.kills;
                totalDeaths += playerData.deaths;
                totalAssists += playerData.assists;
            }
            totalDuration += match.durationSeconds;
        });

        const winRate = ((wins / matches.length) * 100).toFixed(1);
        const avgKDA = totalDeaths > 0 ? ((totalKills + totalAssists) / totalDeaths).toFixed(2) : '完美';
        const avgDuration = Math.round(totalDuration / matches.length / 60);

        const playerName = player.steamAccount?.name || `玩家 ${accountId}`;

        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <h3>🎮 <span style="color: hsl(221 83% 53%); font-weight: 700; font-size: 1.1em; padding: 0.2rem 0.5rem; background-color: hsl(221 83% 53% / 0.1); border-radius: 0.25rem; border-left: 3px solid hsl(221 83% 53%);">${playerName}</span> 的统计概览 (最近${daysBack}天，共${matches.length}场比赛)</h3>
                </div>
                <div class="card-content">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number">${matches.length}</div>
                            <div class="stat-label">总场次</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${wins}</div>
                            <div class="stat-label">胜利</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${winRate}%</div>
                            <div class="stat-label">胜率</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${avgKDA}</div>
                            <div class="stat-label">平均KDA</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${Math.round(totalKills/matches.length)}</div>
                            <div class="stat-label">平均击杀</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${avgDuration}分钟</div>
                            <div class="stat-label">平均时长</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        statsContainer.style.display = 'block';
    }

    function displayMatches(matches, accountId) {
        const matchesContainer = document.getElementById('matchesContainer');
        const playerAccountId = parseInt(accountId);

        const tableHeader = `
            <div class="table">
                <div class="table-header">
                    <div style="display: flex; align-items: center;">
                        <div style="flex: 2;">比赛信息</div>
                        <div style="flex: 1;">英雄</div>
                        <div style="flex: 1;">KDA</div>
                        <div style="flex: 1;">补刀/净值</div>
                        <div style="flex: 1;">时长</div>
                        <div style="flex: 1;">时间</div>
                        <div style="flex: 1;">结果</div>
                    </div>
                </div>
        `;

        const matchRows = matches.map(match => {
            const playerData = match.players.find(p => p.steamAccountId === playerAccountId);

            if (!playerData) {
                return `<div class="table-row">找不到玩家数据</div>`;
            }

            const playerWon = (playerData.isRadiant && match.didRadiantWin) ||
                            (!playerData.isRadiant && !match.didRadiantWin);

            const resultClass = playerWon ? 'badge-success' : 'badge-destructive';
            const resultText = playerWon ? '胜利' : '失败';

            const kda = `${playerData.kills}/${playerData.deaths}/${playerData.assists}`;
            const kdaRatio = playerData.deaths > 0 ?
                ((playerData.kills + playerData.assists) / playerData.deaths).toFixed(2) : '完美';

            return `
                <div class="table-row" onclick="openMatchDetails('${match.id}')" style="cursor: pointer;">
                    <div class="table-cell" style="flex: 2;">
                        <div style="font-weight: 600; color: hsl(var(--foreground));">比赛 #${match.id}</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div style="font-weight: 600; color: hsl(var(--foreground));">${getHeroName(playerData.heroId)}</div>
                        <div style="font-size: 0.75rem; color: hsl(var(--muted-foreground));">等级 ${playerData.level}</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div style="font-weight: 600; color: hsl(var(--foreground));">${kda}</div>
                        <div style="font-size: 0.75rem; color: hsl(var(--muted-foreground));">(${kdaRatio})</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div style="font-weight: 600; color: hsl(var(--foreground));">${playerData.numLastHits}</div>
                        <div style="font-size: 0.75rem; color: hsl(var(--muted-foreground));">${playerData.networth.toLocaleString()}</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div style="font-weight: 600; color: hsl(var(--foreground));">${formatDuration(match.durationSeconds)}</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div style="font-size: 0.75rem; color: hsl(var(--muted-foreground));">${formatDateTime(match.startDateTime)}</div>
                    </div>
                    <div class="table-cell" style="flex: 1;">
                        <div class="match-result ${resultClass}">${resultText}</div>
                    </div>
                </div>
            `;
        }).join('');

        matchesContainer.innerHTML = `
            ${tableHeader}
            ${matchRows}
            </div>
        `;
    }

    function openMatchDetails(matchId) {
        const url = `https://www.opendota.com/matches/${matchId}`;
        window.open(url, '_blank');

    function switchFunction(functionName) {
        const buttons = document.querySelectorAll('.tab');
        buttons.forEach(btn => btn.classList.remove('active'));

        const clickedButton = event.target;
        if (clickedButton && clickedButton.classList.contains('tab')) {
            clickedButton.classList.add('active');
        }

        const pages = document.querySelectorAll('.function-page');
        pages.forEach(page => {
            page.classList.remove('active');
        });
        document.getElementById(`${functionName}-page`).classList.add('active');

        if (window.currentMatches && window.currentAccountId) {
            if (functionName === 'matches') {
                if (window.currentPlayer) {
                    displayStats(window.currentMatches, window.currentAccountId, window.currentPlayer);
                }
            } else if (functionName === 'enemy-heroes') {
                displayEnemyHeroes(window.currentMatches, window.currentAccountId);
            } else if (functionName === 'ally-heroes') {
                displayAllyHeroes(window.currentMatches, window.currentAccountId);
            } else if (functionName === 'my-heroes') {
                displayMyHeroes(window.currentMatches, window.currentAccountId);
            } else if (functionName === 'pick-suggestion') {
                displayPickSuggestion(window.currentMatches, window.currentAccountId);
            }
        }
    }

    function displayEnemyHeroes(matches, accountId) {
        const playerAccountId = parseInt(accountId);
        const daysBack = 30;
        const enemyHeroes = {};

        matches.forEach(match => {
            const playerData = match.players.find(p => p.steamAccountId === playerAccountId);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stratz 比赛数据</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f8f9fb; color:#1a1a2e; line-height:1.5; padding:1.5rem; }
.container { max-width:1200px; margin:0 auto; }
h1 { text-align:right; font-size:1.8rem; }
.subtitle { text-align:right; color:#6b7280; font-size:0.85rem; margin-bottom:1.5rem; }
.tabs { display:flex; gap:0.25rem; background:#eef0f4; padding:0.35rem; border-radius:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
.tab { flex:1; min-width:120px; padding:0.6rem 1rem; text-align:center; border:none; background:transparent; border-radius:0.4rem; cursor:pointer; font-size:0.9rem; color:#4b5563; }
.tab.active { background:#fff; color:#111; font-weight:600; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:0.6rem; padding:1.2rem; margin-bottom:1rem; }
label { display:block; font-weight:600; margin-bottom:0.5rem; }
input { width:100%; padding:0.6rem 0.8rem; border:1px solid #d1d5db; border-radius:0.4rem; font-size:0.95rem; margin-bottom:0.8rem; }
.btn-primary { background:#1f2937; color:#fff; border:none; padding:0.6rem 1.2rem; border-radius:0.4rem; cursor:pointer; }
.function-page { display:none; }
.function-page.active { display:block; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1rem; }
.stat-item { text-align:center; padding:1rem; background:#f9fafb; border-radius:0.5rem; }
.stat-number { font-size:1.6rem; font-weight:700; color:#2563eb; }
.stat-label { font-size:0.8rem; color:#6b7280; }
.table { border:1px solid #e5e7eb; border-radius:0.5rem; overflow:hidden; margin-top:0.8rem; }
.table-header { background:#f3f4f6; padding:0.7rem 1rem; font-weight:600; font-size:0.85rem; }
.table-row { display:flex; align-items:center; padding:0.7rem 1rem; border-top:1px solid #f0f0f0; }
.table-cell { font-size:0.85rem; }
.match-result { padding:0.2rem 0.6rem; border-radius:0.3rem; font-size:0.75rem; font-weight:600; }
.badge-success { background:#dcfce7; color:#166534; }
.badge-destructive { background:#fee2e2; color:#991b1b; }
.section-header { margin:0.5rem 0 0.3rem; }
.section-subheader { margin:1rem 0 0.3rem; }
.no-data { text-align:center; padding:2rem; color:#6b7280; }
.loading { text-align:center; padding:2rem; color:#2563eb; }
.error { background:#fee2e2; color:#991b1b; padding:0.8rem 1rem; border-radius:0.5rem; margin-top:1rem; font-size:0.85rem; }
</style>
</head>
<body>
<div class="container">
<h1>Stratz 比赛数据</h1>
<div class="subtitle">查看Dota2玩家的最近30天比赛记录</div>
<div class="tabs">
<button class="tab active" data-fn="matches">比赛记录</button>
<button class="tab" data-fn="enemy-heroes">敌方英雄统计</button>
<button class="tab" data-fn="ally-heroes">友方英雄统计</button>
<button class="tab" data-fn="my-heroes">我的英雄统计</button>
<button class="tab" data-fn="pick-suggestion">选人建议</button>
</div>
<div class="card">
<label for="playerId">Player ID</label>
<input id="playerId" type="text" placeholder="请输入 Dota 数字 ID (例如: 123456789)">
<button class="btn-primary" id="searchBtn">查询比赛数据</button>
</div>
<div id="loading" class="loading" style="display:none;">加载中...</div>
<div id="error" class="error" style="display:none;"></div>
<div id="matches-page" class="function-page active">
<div id="statsContainer" style="display:none;"></div>
<div id="matchesContainer"></div>
</div>
<div id="enemy-heroes-page" class="function-page"><div id="enemyHeroesContainer"></div></div>
<div id="ally-heroes-page" class="function-page"><div id="allyHeroesContainer"></div></div>
<div id="my-heroes-page" class="function-page"><div id="myHeroesContainer"></div></div>
<div id="pick-suggestion-page" class="function-page"><div id="pickSuggestionContainer"></div></div>
</div>
<script>
const TURBO_MATCHES_QUERY = `query GetPlayerMatches($steamAccountId: Long!) { player(steamAccountId: $steamAccountId) { steamAccountId steamAccount { name } matches(request: { take: 100 }) { id didRadiantWin durationSeconds startDateTime players { steamAccountId isRadiant heroId kills deaths assists networth numLastHits level } } } }`;
const heroNames = {1:"敌法师",2:"斧王",3:"祸乱之源",4:"嗜血狂魔",5:"水晶室女",6:"卓尔游侠",7:"撼地者",8:"主宰",9:"米拉娜",10:"变体精灵",11:"影魔",12:"幻影长矛手",13:"帕克",14:"帕吉",15:"雷泽",16:"沙王",17:"风暴之灵",18:"斯温",19:"小小",20:"复仇之魂",21:"风行者",22:"宙斯",23:"昆卡",25:"莉娜",26:"莱恩",27:"暗影萨满",28:"斯拉达",29:"潮汐猎人",30:"巫医",31:"巫妖",32:"力丸",33:"谜团",34:"修补匠",35:"狙击手",36:"瘟疫法师",37:"术士",38:"兽王",39:"痛苦女王",40:"剧毒术士",41:"虚空假面",42:"冥魂大帝",43:"死亡先知",44:"幻影刺客",45:"帕格纳",46:"圣堂刺客",47:"冥界亚龙",48:"露娜",49:"龙骑士",50:"戴泽",51:"发条技师",52:"拉席克",53:"先知",54:"噬魂鬼",55:"黑暗贤者",56:"克林克兹",57:"全能骑士",58:"魅惑魔女",59:"哈斯卡",60:"暗夜魔王",61:"育母蜘蛛",62:"赏金猎人",63:"编织者",64:"杰奇洛",65:"蝙蝠骑士",66:"陈",67:"幽鬼",68:"远古冰魄",69:"末日使者",70:"熊战士",71:"裂魂人",72:"矮人直升机",73:"炼金术士",74:"祈求者",75:"沉默术士",76:"殁境神蚀者",77:"狼人",78:"酒仙",79:"暗影恶魔",80:"德鲁伊",81:"混沌骑士",82:"米波",83:"树精卫士",84:"食人魔魔法师",85:"不朽尸王",86:"拉比克",87:"干扰者",88:"司夜刺客",89:"娜迦海妖",90:"光之守卫",91:"艾欧",92:"维萨吉",93:"斯拉克",94:"美杜莎",95:"巨魔战将",96:"半人马战行者",97:"马格纳斯",98:"伐木机",99:"钢背兽",100:"巨牙海民",101:"天怒法师",102:"亚巴顿",103:"上古巨神",104:"军团指挥官",105:"工程师",106:"灰烬之灵",107:"大地之灵",108:"孽主",109:"恐怖利刃",110:"凤凰",111:"神谕者",112:"寒冬飞龙",113:"天穹守望者",114:"齐天大圣",119:"邪影芳灵",120:"石鳞剑士",121:"天涯墨客",123:"森海飞霞",126:"虚无之灵",128:"电炎绝手",129:"玛尔斯",131:"马戏团长",135:"破晓晨光",136:"玛西",137:"兽",138:"琼英碧灵",145:"凯"};
function getHeroName(id){ return heroNames[id] || ("英雄 " + id); }
function formatDuration(s){ const m=Math.floor(s/60); const r=s%60; return m + ":" + String(r).padStart(2,"0"); }
function formatDateTime(ts){ return new Date(ts*1000).toLocaleString("zh-CN"); }
function showError(msg){ const e=document.getElementById("error"); e.textContent=msg; e.style.display="block"; }
function hideError(){ document.getElementById("error").style.display="none"; }
let currentMatches=null, currentAccountId=null, currentPlayer=null;
async function fetchMatches(){
  const input=document.getElementById("playerId").value.trim();
  if(!input){ showError("请输入Player ID"); return; }
  const accountId=input;
  localStorage.setItem("savedPlayerId", input);
  const daysBack=30;
  const loadingEl=document.getElementById("loading");
  const btn=document.getElementById("searchBtn");
  hideError(); loadingEl.style.display="block";
  document.getElementById("matchesContainer").innerHTML=""; document.getElementById("statsContainer").style.display="none"; btn.disabled=true;
  try{
    const resp=await fetch("/api/stratz",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:TURBO_MATCHES_QUERY, variables:{ steamAccountId:parseInt(accountId) } }) });
    if(!resp.ok){ const t=await resp.text(); throw new Error("HTTP错误: " + resp.status + " - " + t); }
    const data=await resp.json();
    if(data.errors){ throw new Error("GraphQL错误: " + data.errors[0].message); }
    const player=data.data && data.data.player;
    if(!player){ throw new Error("找不到该玩家，请检查ID是否正确"); }
    const all=player.matches;
    if(!all || all.length===0){ showNoData(); return; }
    const cutoff=Math.floor(Date.now()/1000) - daysBack*24*60*60;
    const filtered=all.filter(function(m){ return m.startDateTime >= cutoff; });
    if(filtered.length===0){ showNoData(); return; }
    currentMatches=filtered; currentAccountId=accountId; currentPlayer=player;
    displayMatches(filtered, accountId); displayStats(filtered, accountId, player);
    renderActiveTab();
  }catch(err){ showError("获取数据失败: " + err.message); }
  finally{ loadingEl.style.display="none"; btn.disabled=false; }
}
function showNoData(){ document.getElementById("matchesContainer").innerHTML = '<div class="no-data"><h3>没有找到数据</h3><p>最近30天没有找到比赛记录，或者ID输入不正确</p></div>'; }
function playerWonMatch(pd, m){ return (pd.isRadiant && m.didRadiantWin) || (!pd.isRadiant && !m.didRadiantWin); }
function displayStats(matches, accountId, player){
  const id=parseInt(accountId); let wins=0,k=0,d=0,a=0,dur=0;
  matches.forEach(function(m){ const pd=m.players.find(function(p){return p.steamAccountId===id;}); if(pd){ if(playerWonMatch(pd,m)) wins++; k+=pd.kills; d+=pd.deaths; a+=pd.assists; } dur+=m.durationSeconds; });
  const winRate=((wins/matches.length)*100).toFixed(1);
  const kda=d>0 ? ((k+a)/d).toFixed(2) : "完美";
  const avgDur=Math.round(dur/matches.length/60);
  const name=(player.steamAccount && player.steamAccount.name) || ("玩家 " + accountId);
  const sc=document.getElementById("statsContainer");
  let h = "<div class=" + JSON.stringify("card") + "><h3>🎮 " + name + " 的统计概览 (最近30天，共" + matches.length + "场)</h3><div class=" + JSON.stringify("stats-grid") + ">";
  function cell(n,l){ return "<div class=" + JSON.stringify("stat-item") + "><div class=" + JSON.stringify("stat-number") + ">" + n + "</div><div class=" + JSON.stringify("stat-label") + ">" + l + "</div></div>"; }
  h += cell(matches.length,"总场次") + cell(wins,"胜利") + cell(winRate + "%","胜率") + cell(kda,"平均KDA") + cell(Math.round(k/matches.length),"平均击杀") + cell(avgDur + "分钟","平均时长");
  h += "</div></div>";
  sc.innerHTML=h; sc.style.display="block";
}
function td(flex, inner){ return "<div class=" + JSON.stringify("table-cell") + " style=" + JSON.stringify("flex:"+flex+";") + ">" + inner + "</div>"; }
function displayMatches(matches, accountId){
  const id=parseInt(accountId);
  let rows = "<div class=" + JSON.stringify("table") + "><div class=" + JSON.stringify("table-header") + "><div style=" + JSON.stringify("display:flex;") + ">";
  rows += td(2,"比赛信息") + td(1,"英雄") + td(1,"KDA") + td(1,"补刀/净值") + td(1,"时长") + td(1,"时间") + td(1,"结果");
  rows += "</div></div>";
  matches.forEach(function(m){
    const pd=m.players.find(function(p){return p.steamAccountId===id;});
    if(!pd) return;
    const won=playerWonMatch(pd,m);
    const cls=won?"badge-success":"badge-destructive"; const txt=won?"胜利":"失败";
    const kda=pd.kills + "/" + pd.deaths + "/" + pd.assists;
    const ratio=pd.deaths>0 ? ((pd.kills+pd.assists)/pd.deaths).toFixed(2) : "完美";
    rows += "<div class=" + JSON.stringify("table-row") + " style=" + JSON.stringify("cursor:pointer;") + " data-mid=" + JSON.stringify(String(m.id)) + ">";
    rows += td(2,"比赛 #" + m.id);
    rows += td(1, getHeroName(pd.heroId) + "<br><small>等级 " + pd.level + "</small>");
    rows += td(1, kda + " (" + ratio + ")");
    rows += td(1, pd.numLastHits + "<br><small>" + pd.networth.toLocaleString() + "</small>");
    rows += td(1, formatDuration(m.durationSeconds));
    rows += td(1, "<small>" + formatDateTime(m.startDateTime) + "</small>");
    rows += td(1, "<span class=" + JSON.stringify("match-result " + cls) + ">" + txt + "</span>");
    rows += "</div>";
  });
  rows += "</div>";
  const c=document.getElementById("matchesContainer"); c.innerHTML=rows;
  c.querySelectorAll("[data-mid]").forEach(function(el){ el.addEventListener("click", function(){ window.open("https://www.opendota.com/matches/" + el.getAttribute("data-mid"), "_blank"); }); });
}
function heroRankTable(title, entries, valLabel){
  let h = "<h3 class=" + JSON.stringify("section-header") + ">" + title + "</h3><div class=" + JSON.stringify("table") + "><div class=" + JSON.stringify("table-header") + "><div style=" + JSON.stringify("display:flex;") + ">" + td(1,"排名") + td(3,"英雄名称") + td(1,valLabel) + "</div></div>";
  entries.forEach(function(e,i){ h += "<div class=" + JSON.stringify("table-row") + ">" + td(1,"#"+(i+1)) + td(3,e[0]) + td(1,e[1]) + "</div>"; });
  h += "</div>"; return h;
}
function displayEnemyHeroes(matches, accountId){
  const id=parseInt(accountId); const map={};
  matches.forEach(function(m){ const pd=m.players.find(function(p){return p.steamAccountId===id;}); if(pd && !playerWonMatch(pd,m)){ m.players.forEach(function(p){ if(p.steamAccountId!==id && p.isRadiant!==pd.isRadiant){ const n=getHeroName(p.heroId); map[n]=(map[n]||0)+1; } }); } });
  const sorted=Object.entries(map).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  const c=document.getElementById("enemyHeroesContainer");
  c.innerHTML = sorted.length ? heroRankTable("输掉比赛中最常见的敌方英雄", sorted, "出现次数") : "<div class=" + JSON.stringify("no-data") + ">没有输掉的比赛数据</div>";
}
function displayAllyHeroes(matches, accountId){
  const id=parseInt(accountId); const map={};
  matches.forEach(function(m){ const pd=m.players.find(function(p){return p.steamAccountId===id;}); if(pd && playerWonMatch(pd,m)){ m.players.forEach(function(p){ if(p.steamAccountId!==id && p.isRadiant===pd.isRadiant){ const n=getHeroName(p.heroId); map[n]=(map[n]||0)+1; } }); } });
  const sorted=Object.entries(map).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  const c=document.getElementById("allyHeroesContainer");
  c.innerHTML = sorted.length ? heroRankTable("胜利比赛中最常见的友方英雄", sorted, "出现次数") : "<div class=" + JSON.stringify("no-data") + ">没有胜利的比赛数据</div>";
}
function displayMyHeroes(matches, accountId){
  const id=parseInt(accountId); const stats={};
  matches.forEach(function(m){ const pd=m.players.find(function(p){return p.steamAccountId===id;}); if(pd){ const n=getHeroName(pd.heroId); if(!stats[n]) stats[n]={total:0,wins:0}; stats[n].total++; if(playerWonMatch(pd,m)) stats[n].wins++; } });
  const arr=Object.entries(stats).filter(function(e){return e[1].total>=2;}).map(function(e){ return [e[0], (e[1].wins/e[1].total*100).toFixed(1) + "% (" + e[1].wins + "/" + e[1].total + ")"]; }).sort(function(a,b){return parseFloat(b[1])-parseFloat(a[1]);}).slice(0,15);
  const c=document.getElementById("myHeroesContainer");
  c.innerHTML = arr.length ? heroRankTable("我的英雄胜率 (至少2场)", arr, "胜率") : "<div class=" + JSON.stringify("no-data") + ">没有足够的比赛数据</div>";
}
function displayPickSuggestion(matches, accountId){
  const id=parseInt(accountId); const syn={};
  matches.forEach(function(m){ const pd=m.players.find(function(p){return p.steamAccountId===id;}); if(pd && playerWonMatch(pd,m)){ const mine=getHeroName(pd.heroId); m.players.forEach(function(p){ if(p.steamAccountId!==id && p.isRadiant===pd.isRadiant){ const mate=getHeroName(p.heroId); if(!syn[mate]) syn[mate]={total:0,mine:{}}; syn[mate].total++; syn[mate].mine[mine]=(syn[mate].mine[mine]||0)+1; } }); } });
  const sorted=Object.entries(syn).filter(function(e){return e[1].total>=2;}).sort(function(a,b){return b[1].total-a[1].total;}).slice(0,15);
  const c=document.getElementById("pickSuggestionContainer");
  if(!sorted.length){ c.innerHTML="<div class=" + JSON.stringify("no-data") + ">胜利数据不足以生成选人建议</div>"; return; }
  let h = "<h3 class=" + JSON.stringify("section-header") + ">选人建议 - 最佳队友配合</h3><div class=" + JSON.stringify("table") + ">";
  sorted.forEach(function(e,i){ const best=Object.entries(e[1].mine).sort(function(x,y){return y[1]-x[1];}).slice(0,3).map(function(x){return x[0] + "(" + x[1] + "胜)";}).join("、"); h += "<div class=" + JSON.stringify("table-row") + ">" + td(1,"#"+(i+1)) + td(2, e[0] + "<br><small>共" + e[1].total + "胜</small>") + td(3, "推荐: " + best) + "</div>"; });
  h += "</div>"; c.innerHTML=h;
}
let activeFn="matches";
function renderActiveTab(){
  if(!currentMatches) return;
  if(activeFn==="matches"){ if(currentPlayer) displayStats(currentMatches,currentAccountId,currentPlayer); }
  else if(activeFn==="enemy-heroes") displayEnemyHeroes(currentMatches,currentAccountId);
  else if(activeFn==="ally-heroes") displayAllyHeroes(currentMatches,currentAccountId);
  else if(activeFn==="my-heroes") displayMyHeroes(currentMatches,currentAccountId);
  else if(activeFn==="pick-suggestion") displayPickSuggestion(currentMatches,currentAccountId);
}
function switchFunction(fn, btn){
  activeFn=fn;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
  document.querySelectorAll(".function-page").forEach(function(pg){ pg.classList.remove("active"); });
  document.getElementById(fn + "-page").classList.add("active");
  renderActiveTab();
}
document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("searchBtn").addEventListener("click", fetchMatches);
  document.getElementById("playerId").addEventListener("keypress", function(e){ if(e.key==="Enter") fetchMatches(); });
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ switchFunction(b.getAttribute("data-fn"), b); }); });
  const params=new URLSearchParams(location.search);
  const urlId=params.get("id") || params.get("playerId");
  if(urlId) localStorage.setItem("savedPlayerId", urlId);
  const saved=urlId || localStorage.getItem("savedPlayerId");
  if(saved){ document.getElementById("playerId").value=saved; fetchMatches(); }
});
</script>
</body>
</html>
